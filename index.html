<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>BlackCam</title>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; touch-action:none; }
  #pad { position:fixed; inset:0; background:#000; }
  .line { position:fixed; background:#161616; pointer-events:none; }
  #h1 { left:0; right:0; top:40%; height:1px; }
  #h2 { left:0; right:0; top:60%; height:1px; }
  #v1 { left:50%; width:1px; top:0; height:40%; }
  #v2 { left:50%; width:1px; top:60%; bottom:0; }
  #camLabel { position:fixed; left:0; right:0; top:40%; height:20%; display:flex;
    align-items:center; justify-content:center; color:#1c1c1c; font:13px -apple-system, sans-serif; pointer-events:none; }
  video { position:fixed; width:1px; height:1px; opacity:0; pointer-events:none; }
  #dot { position:fixed; top:calc(env(safe-area-inset-top) + 8px); right:12px;
    width:8px; height:8px; border-radius:50%; background:#f00; opacity:0; pointer-events:none; }
  #msg { position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 24px);
    text-align:center; color:#2a2a2a; font:14px -apple-system, sans-serif; pointer-events:none; }
  #guide { position:fixed; inset:0; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:2fr 1fr 2fr;
    pointer-events:none; opacity:0; transition:opacity .6s; }
  #guide div { display:flex; align-items:center; justify-content:center; text-align:center;
    padding:8px; color:#444; font:15px -apple-system, sans-serif; }
  #guide .mid { grid-column:1 / 3; }
  #save { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 60px);
    transform:translateX(-50%); display:none; background:#050505; color:#2a2a2a;
    border:1px solid #111; border-radius:20px; padding:12px 24px; font:15px -apple-system, sans-serif; }
</style>
</head>
<body>
<video id="v" muted playsinline autoplay></video>
<div id="pad"></div>
<div class="line" id="h1"></div>
<div class="line" id="h2"></div>
<div class="line" id="v1"></div>
<div class="line" id="v2"></div>
<div id="camLabel"></div>
<div id="guide">
  <div>左上：写真</div>
  <div>右上：写真＋ライト</div>
  <div class="mid">中央：インカメラ／背面カメラ 切替</div>
  <div>左下：動画 開始／停止</div>
  <div>右下：動画＋ライト 開始／停止</div>
</div>
<div id="dot"></div>
<button id="save"></button>
<div id="msg">タップでカメラを起動</div>

<script>
const SHOW_DOT   = false; // 録画中の赤い点（表示するなら true）
const SHOW_GUIDE = false; // 起動時の操作説明（表示するなら true）
const HAPTICS    = true;  // 振動（不要なら false）
const TORCH_WAIT = 600;   // 写真でライト点灯後、撮影までの待ち時間（ミリ秒）

const v = document.getElementById('v');
const pad = document.getElementById('pad');
const dot = document.getElementById('dot');
const msg = document.getElementById('msg');
const guide = document.getElementById('guide');
const save = document.getElementById('save');
const camLabel = document.getElementById('camLabel');

let stream = null, videoTrack = null, audioTrack = null;
let rec = null, chunks = [], pending = [], wakeLock = null, torchOn = false, photoBusy = false;
let facing = 'environment', switching = false; // environment＝背面カメラ、user＝インカメラ

function videoConstraints(exact) {
  return { facingMode: exact ? { exact: facing } : { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1080 } };
}

// 振動（iOS 18以降のSafari）
function haptic(times = 1) {
  if (!HAPTICS) return;
  for (let i = 0; i < times; i++) {
    setTimeout(() => {
      const label = document.createElement('label');
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.setAttribute('switch', '');
      label.style.display = 'none';
      label.appendChild(input);
      document.body.appendChild(label);
      label.click();
      label.remove();
    }, i * 150);
  }
}

// 今の向き（背面／イン）のカメラ映像だけを取得（マイクは取り直さない）
async function openVideoTrack() {
  let s;
  try {
    s = await navigator.mediaDevices.getUserMedia({ video: videoConstraints(true), audio: false });
  } catch (e) {
    s = await navigator.mediaDevices.getUserMedia({ video: videoConstraints(false), audio: false });
  }
  return s.getVideoTracks()[0];
}

// 映像トラックとマイクトラックを1本のストリームにまとめてプレビューに流す
function attachStream() {
  stream = new MediaStream(audioTrack ? [videoTrack, audioTrack] : [videoTrack]);
  v.srcObject = stream;
  v.play().catch(() => {});
}

// カメラ起動（マイクはここで1回だけ取得し、カメラ切替後も使い回す）
async function startCamera() {
  let s;
  try {
    s = await navigator.mediaDevices.getUserMedia({ video: videoConstraints(true), audio: true });
  } catch (e) {
    try {
      s = await navigator.mediaDevices.getUserMedia({ video: videoConstraints(false), audio: true });
    } catch (e2) {
      s = await navigator.mediaDevices.getUserMedia({ video: videoConstraints(false), audio: false });
    }
  }
  videoTrack = s.getVideoTracks()[0];
  audioTrack = s.getAudioTracks()[0] || null;
  attachStream();
  msg.textContent = '';
  if (SHOW_GUIDE) {
    guide.style.opacity = 1;
    setTimeout(() => { guide.style.opacity = 0; }, 3000);
  }
  keepAwake();
}

// インカメラ／背面カメラの切替（映像トラックだけ入れ替える）
async function switchCamera() {
  if (switching || photoBusy || (rec && rec.state === 'recording')) return;
  switching = true;
  const prev = facing;
  try {
    if (torchOn) await setTorch(false);
    videoTrack.stop(); // iOSは別のカメラを同時に使えないため、先に今のカメラを止める
    facing = facing === 'environment' ? 'user' : 'environment';
    try {
      videoTrack = await openVideoTrack();
    } catch (e) {
      facing = prev; // 切替に失敗したら元のカメラに戻す
      videoTrack = await openVideoTrack();
    }
    attachStream();
    camLabel.textContent = facing === 'user' ? 'インカメラ' : '';
    haptic(1);
  } catch (e) {
    if (audioTrack) audioTrack.stop();
    stream = null; videoTrack = null; audioTrack = null;
    msg.textContent = 'タップでカメラを再起動';
  } finally {
    switching = false;
  }
}

// ライト（トーチ）の点灯・消灯（インカメラにはライトがないため何もしない）
async function setTorch(on) {
  if (facing === 'user' || !videoTrack) return false;
  const tries = [
    { advanced: [{ torch: on }] }, // iOS Safariで動作報告のある書き方
    { torch: on }
  ];
  for (const c of tries) {
    try {
      await videoTrack.applyConstraints(c);
      torchOn = on;
      return true;
    } catch (e) {}
  }
  return false;
}

// 画面の自動ロック防止
async function keepAwake() {
  try {
    if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
  } catch (e) {}
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && rec && rec.state === 'recording') rec.stop();
  if (document.visibilityState === 'hidden' && torchOn) setTorch(false);
  if (document.visibilityState === 'visible' && stream) keepAwake();
});

// 録画の開始・停止（withLight = true でライト点灯）
async function toggleVideo(withLight) {
  if (rec && rec.state === 'recording') {
    rec.stop();
    haptic(2);
    return;
  }
  haptic(1);
  if (withLight) await setTorch(true);
  const type = MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : '';
  rec = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
  chunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    dot.style.opacity = 0;
    if (torchOn) setTorch(false);
    const blob = new Blob(chunks, { type: 'video/mp4' });
    chunks = [];
    if (blob.size) addPending(new File([blob], fileName('mp4'), { type: 'video/mp4' }));
  };
  rec.start(1000);
  if (SHOW_DOT) dot.style.opacity = 0.4;
}

// 無音の写真撮影（withLight = true でライトを点けて撮影し、撮影後に消灯）
async function takePhoto(withLight) {
  if (!v.videoWidth || photoBusy) return;
  photoBusy = true;
  haptic(1);
  try {
    if (withLight && await setTorch(true)) {
      await new Promise(r => setTimeout(r, TORCH_WAIT)); // 明るさが合うまで待つ
    }
    blink();
    const c = document.createElement('canvas');
    c.width = v.videoWidth;
    c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0);
    c.toBlob(b => {
      if (b) addPending(new File([b], fileName('jpg'), { type: 'image/jpeg' }));
    }, 'image/jpeg', 0.92);
  } finally {
    if (withLight && torchOn) await setTorch(false);
    photoBusy = false;
  }
}

function blink() {
  if (!SHOW_DOT || (rec && rec.state === 'recording')) return;
  dot.style.background = '#888';
  dot.style.opacity = 0.4;
  setTimeout(() => { dot.style.opacity = 0; dot.style.background = '#f00'; }, 150);
}

function fileName(ext) {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `BlackCam_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}_${d.getMilliseconds()}.${ext}`;
}

function addPending(file) { pending.push(file); updateSave(); }

function updateSave() {
  save.style.display = pending.length ? 'block' : 'none';
  save.textContent = `保存（${pending.length}件）`;
}

// 保存（共有シート →「ビデオを保存」「画像を保存」）
save.addEventListener('click', async e => {
  e.stopPropagation();
  const files = pending.slice();
  if (navigator.canShare && navigator.canShare({ files })) {
    try { await navigator.share({ files }); } catch (err) { return; } // キャンセル時は残す
  } else {
    files.forEach(f => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(f);
      a.download = f.name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    });
  }
  pending = [];
  updateSave();
});

// 操作：上段 左＝写真／右＝写真＋ライト、中央＝カメラ切替、下段 左＝動画／右＝動画＋ライト
// 録画中はどこをタップしても停止
let downX = 0, downY = 0, downT = 0, lastAction = 0;

pad.addEventListener('pointerdown', e => {
  downX = e.clientX; downY = e.clientY; downT = Date.now();
});

pad.addEventListener('pointerup', async e => {
  const moved = Math.hypot(e.clientX - downX, e.clientY - downY);
  if (moved > 20 || Date.now() - downT > 800) return; // スワイプ・長押しは無視
  if (Date.now() - lastAction < 500) return;          // 連続反応の防止
  lastAction = Date.now();

  if (!stream) {
    haptic(1);
    try { await startCamera(); } catch (err) { msg.textContent = 'カメラとマイクを許可してください'; }
    return;
  }
  if (rec && rec.state === 'recording') { toggleVideo(false); return; }

  const y = e.clientY / window.innerHeight;
  const isRight = e.clientX >= window.innerWidth / 2;
  if (y < 0.4) takePhoto(isRight);
  else if (y < 0.6) switchCamera();
  else toggleVideo(isRight);
});
</script>
</body>
</html>
