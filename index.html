<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; touch-action:none; }
  #pad { position:fixed; inset:0; background:#000; }
  .line { position:fixed; background:#0e0e0e; pointer-events:none; }
  #h1 { left:0; right:0; top:40%; height:1px; }
  #h2 { left:0; right:0; top:60%; height:1px; }
  #v1 { left:50%; width:1px; top:0; height:40%; }
  #v2 { left:50%; width:1px; top:60%; bottom:0; }
  video { position:fixed; width:1px; height:1px; opacity:0; pointer-events:none; }
  #dot { position:fixed; top:calc(env(safe-area-inset-top) + 8px); right:12px;
    width:8px; height:8px; border-radius:50%; background:#f00; opacity:0; pointer-events:none; }
  #msg { position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 24px);
    text-align:center; color:#2a2a2a; font:14px -apple-system, sans-serif; pointer-events:none; }
  #guide { position:fixed; inset:0; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:2fr 1fr 2fr;
    pointer-events:none; opacity:0; transition:opacity .6s; }
  #guide div { display:flex; align-items:center; justify-content:center; text-align:center;
    padding:8px; color:#444; font:15px -apple-system, sans-serif; }
  #guide .mid { grid-column:1 / 3; }
  #save { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 60px);
    transform:translateX(-50%); display:none; background:#050505; color:#2a2a2a;
    border:1px solid #111; border-radius:20px; padding:12px 24px; font:15px -apple-system, sans-serif; }
</style>
</head>
<body>
<video id="v" muted playsinline autoplay></video>
<div id="pad"></div>
<div class="line" id="h1"></div>
<div class="line" id="h2"></div>
<div class="line" id="v1"></div>
<div class="line" id="v2"></div>
<div id="guide">
  <div>左上：写真</div>
  <div>右上：写真＋ライト</div>
  <div class="mid">中央：インカメラ動画 開始／停止</div>
  <div>左下：動画 開始／停止</div>
  <div>右下：動画＋ライト 開始／停止</div>
</div>
<div id="dot"></div>
<button id="save"></button>
<div id="msg">タップでカメラを起動</div>

<script>
// カメラは最初のタップで起動し、そのまま入れっぱなし
// マイクは使わない（動画は音声なし。画面上のオレンジ表示も出ない）
const SHOW_DOT   = false; // 録画中の赤い点（表示するなら true）
const SHOW_GUIDE = false; // 起動時の操作説明（表示するなら true）
const HAPTICS    = true;  // 振動（不要なら false）
const TORCH_WAIT = 600;   // 写真でライト点灯後、撮影までの待ち時間（ミリ秒）

const v = document.getElementById('v');
const pad = document.getElementById('pad');
const dot = document.getElementById('dot');
const msg = document.getElementById('msg');
const guide = document.getElementById('guide');
const save = document.getElementById('save');

let stream = null, videoTrack = null;
let rec = null, chunks = [], pending = [], wakeLock = null, torchOn = false, busy = false;
let facing = 'environment'; // environment＝背面カメラ、user＝インカメラ
let camQueue = Promise.resolve(); // カメラ切替を1つずつ順番に行うための待ち行列
let lastCamError = ''; // カメラを開けなかった理由（画面下の表示用）
let backDeviceId = ''; // 背面カメラの識別番号

const sleep = ms => new Promise(r => setTimeout(r, ms));

// 振動（Androidは標準の振動機能、iPhoneはiOS 18以降のSafariの仕組みを使う）
function haptic(times = 1) {
  if (!HAPTICS) return;
  if (navigator.vibrate) {
    const pattern = [];
    for (let i = 0; i < times; i++) pattern.push(40, 110);
    navigator.vibrate(pattern);
    return;
  }
  for (let i = 0; i < times; i++) {
    setTimeout(() => {
      const label = document.createElement('label');
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.setAttribute('switch', '');
      label.style.display = 'none';
      label.appendChild(input);
      document.body.appendChild(label);
      label.click();
      label.remove();
    }, i * 150);
  }
}

// 画面下に薄くメッセージを出して数秒で消す
function notice(text) {
  msg.textContent = text;
  setTimeout(() => { if (msg.textContent === text) msg.textContent = ''; }, 4000);
}

// 指定した向き（背面／イン）のカメラ映像を取得（マイクなし）
async function openVideoTrack(want) {
  const tries = [
    { facingMode: { exact: want }, width: { ideal: 1920 }, height: { ideal: 1080 } },
    { facingMode: { exact: want } },
    { facingMode: want }
  ];
  let lastErr = null;
  // Androidは直前のカメラの解放に時間がかかることがあるため、少し待って最大3回やり直す
  for (let round = 0; round < 3; round++) {
    if (round > 0) await sleep(400 * round);
    for (const video of tries) {
      try {
        const s = await navigator.mediaDevices.getUserMedia({ video, audio: false });
        const t = s.getVideoTracks()[0];
        const fm = t.getSettings ? t.getSettings().facingMode : undefined;
        if (fm && fm !== want) { t.stop(); continue; } // 違う向きのカメラが開いたらやり直す
        return t;
      } catch (e) {
        lastErr = e;
        if (e.name === 'NotAllowedError') throw e; // 許可されていないときはやり直しても無駄
      }
    }
  }
  // 最後の手段：カメラの名前（front／back など）から探す。名前で分からなければ背面以外のカメラを使う
  try {
    const re = want === 'user' ? /front|前面|フロント|user/i : /back|背面|バック|rear|environment/i;
    const cams = (await navigator.mediaDevices.enumerateDevices()).filter(x => x.kind === 'videoinput');
    const d = cams.find(x => re.test(x.label)) ||
      (want === 'user' ? cams.find(x => x.deviceId && x.deviceId !== backDeviceId)
                       : cams.find(x => x.deviceId && x.deviceId === backDeviceId));
    if (d) {
      const s = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: d.deviceId } }, audio: false });
      return s.getVideoTracks()[0];
    }
  } catch (e) { lastErr = e; }
  throw lastErr || new Error('カメラが見つかりません');
}

// 背面カメラの識別番号を覚えておく（インカメラを探すときの目印）
function rememberBack() {
  try {
    if (facing === 'environment' && videoTrack) backDeviceId = videoTrack.getSettings().deviceId || backDeviceId;
  } catch (e) {}
}

// 映像をプレビュー（非表示）に流し、流れ始めるまで待つ
async function attachStream() {
  stream = new MediaStream([videoTrack]);
  v.srcObject = stream;
  v.play().catch(() => {});
  const start = Date.now();
  while (Date.now() - start < 2000) {
    if (v.videoWidth && v.readyState >= 2) break;
    await sleep(50);
  }
}

// カメラ起動（背面カメラ）
async function startCamera() {
  videoTrack = await openVideoTrack('environment');
  facing = 'environment';
  rememberBack();
  await attachStream();
  msg.textContent = '';
  if (SHOW_GUIDE) {
    guide.style.opacity = 1;
    setTimeout(() => { guide.style.opacity = 0; }, 3000);
  }
  keepAwake();
}

// 指定した向きのカメラに切り替える（すでにその向きなら何もしない）。成功で true
function useCamera(want) {
  camQueue = camQueue.then(async () => {
    if (!stream) return false;
    if (facing === want && videoTrack && videoTrack.readyState === 'live') return true;
    if (torchOn) await setTorch(false);
    const prev = facing;
    lastCamError = '';
    videoTrack.stop(); // iOS・Androidは別のカメラを同時に使えないため、先に今のカメラを止める
    v.srcObject = null;
    await sleep(150);  // カメラが解放されるのを少し待つ
    try {
      videoTrack = await openVideoTrack(want);
      facing = want;
      await attachStream();
      await sleep(200); // 明るさ・ピントが落ち着くまで少し待つ
      return true;
    } catch (e) {
      lastCamError = e.name || e.message || '';
      try {
        videoTrack = await openVideoTrack(prev); // 失敗したら元のカメラに戻す
        facing = prev;
        await attachStream();
      } catch (e2) {
        stream = null; videoTrack = null;
        msg.textContent = 'タップでカメラを再起動';
      }
      return false;
    }
  }).catch(() => false);
  return camQueue;
}

// ライト（トーチ）の点灯・消灯（インカメラにはライトがないため何もしない）
async function setTorch(on) {
  if (facing === 'user' || !videoTrack) return false;
  const tries = [
    { advanced: [{ torch: on }] }, // iOS Safariで動作報告のある書き方
    { torch: on }
  ];
  for (const c of tries) {
    try {
      await videoTrack.applyConstraints(c);
      torchOn = on;
      return true;
    } catch (e) {}
  }
  // 消灯できない機種（一部のAndroid）では、カメラを開き直してライトを確実に消す
  if (!on && torchOn) {
    try {
      videoTrack.stop();
      videoTrack = await openVideoTrack(facing);
      await attachStream();
    } catch (e) {}
    torchOn = false;
  }
  return false;
}

// 録画形式（iPhoneはMP4、AndroidはMP4が使えなければWebM）
function pickVideoType() {
  const list = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  for (const t of list) {
    try { if (MediaRecorder.isTypeSupported(t)) return t; } catch (e) {}
  }
  return '';
}

// 画面の自動ロック防止
async function keepAwake() {
  try {
    if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
  } catch (e) {}
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && rec && rec.state === 'recording') rec.stop();
  if (document.visibilityState === 'hidden' && torchOn) setTorch(false);
  if (document.visibilityState === 'visible' && stream) keepAwake();
});

// 録画の停止
function stopVideo() {
  if (rec && rec.state === 'recording') {
    rec.stop();
    haptic(2);
  }
}

// 録画の開始（want＝使うカメラ、withLight＝ライト点灯）
async function startVideo(want, withLight) {
  if (busy) return;
  busy = true;
  haptic(1);
  try {
    if (!(await useCamera(want))) { notice((want === 'user' ? 'インカメラを開けませんでした' : 'カメラを開けませんでした') + (lastCamError ? `（${lastCamError}）` : '')); return; }
    if (withLight) await setTorch(true);
    const type = pickVideoType();
    rec = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
    chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      dot.style.opacity = 0;
      if (torchOn) setTorch(false);
      const mime = (rec.mimeType || type || 'video/mp4').split(';')[0];
      const ext = mime.includes('webm') ? 'webm' : 'mp4';
      const blob = new Blob(chunks, { type: mime });
      chunks = [];
      if (blob.size) addPending(new File([blob], fileName(ext), { type: mime }));
      if (facing === 'user') useCamera('environment'); // インカメラ録画のあとは背面カメラに戻す
    };
    rec.start(1000);
    if (SHOW_DOT) dot.style.opacity = 0.4;
  } finally {
    busy = false;
  }
}

// 無音の写真撮影（背面カメラ。withLight = true でライトを点けて撮影し、撮影後に消灯）
async function takePhoto(withLight) {
  if (busy) return;
  busy = true;
  haptic(1);
  try {
    if (!(await useCamera('environment')) || !v.videoWidth) return;
    if (withLight && await setTorch(true)) await sleep(TORCH_WAIT); // 明るさが合うまで待つ
    blink();
    const c = document.createElement('canvas');
    c.width = v.videoWidth;
    c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0);
    c.toBlob(b => {
      if (b) addPending(new File([b], fileName('jpg'), { type: 'image/jpeg' }));
    }, 'image/jpeg', 0.92);
  } finally {
    if (withLight && torchOn) await setTorch(false);
    busy = false;
  }
}

function blink() {
  if (!SHOW_DOT || (rec && rec.state === 'recording')) return;
  dot.style.background = '#888';
  dot.style.opacity = 0.4;
  setTimeout(() => { dot.style.opacity = 0; dot.style.background = '#f00'; }, 150);
}

function fileName(ext) {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `BlackCam_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}_${d.getMilliseconds()}.${ext}`;
}

function addPending(file) { pending.push(file); updateSave(); }

function updateSave() {
  save.style.display = pending.length ? 'block' : 'none';
  save.textContent = `保存（${pending.length}件）`;
}

// 保存（共有シート →「ビデオを保存」「画像を保存」）
save.addEventListener('click', async e => {
  e.stopPropagation();
  const files = pending.slice();
  let shared = false;
  if (navigator.canShare && navigator.canShare({ files })) {
    try { await navigator.share({ files }); shared = true; }
    catch (err) { if (err.name === 'AbortError') return; } // キャンセル時は残す。それ以外の失敗はダウンロードで保存
  }
  if (!shared) {
    files.forEach(f => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(f);
      a.download = f.name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    });
  }
  pending = [];
  updateSave();
});

// 操作：上段 左＝写真／右＝写真＋ライト
//       中央＝インカメラ動画
//       下段 左＝動画／右＝動画＋ライト
// 録画中はどこをタップしても停止
let downX = 0, downY = 0, downT = 0, lastAction = 0;

pad.addEventListener('pointerdown', e => {
  downX = e.clientX; downY = e.clientY; downT = Date.now();
});

pad.addEventListener('pointerup', async e => {
  const moved = Math.hypot(e.clientX - downX, e.clientY - downY);
  if (moved > 20 || Date.now() - downT > 800) return; // スワイプ・長押しは無視
  if (Date.now() - lastAction < 500) return;          // 連続反応の防止
  lastAction = Date.now();

  if (!stream) {
    haptic(1);
    try { await startCamera(); }
    catch (err) { msg.textContent = err && err.name === 'NotAllowedError' ? 'カメラを許可してください' : 'カメラを開けませんでした'; }
    return;
  }
  if (rec && rec.state === 'recording') { stopVideo(); return; }

  const y = e.clientY / window.innerHeight;
  const isRight = e.clientX >= window.innerWidth / 2;
  if (y < 0.4) takePhoto(isRight);
  else if (y < 0.6) startVideo('user', false);
  else startVideo('environment', isRight);
});
</script>
</body>
</html>
