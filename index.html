<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>BlackCam</title>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; touch-action:none; }
  #pad { position:fixed; inset:0; background:#000; }
  .line { position:fixed; background:#0e0e0e; pointer-events:none; }
  #h1 { left:0; right:0; top:40%; height:1px; }
  #h2 { left:0; right:0; top:60%; height:1px; }
  #v1 { left:50%; width:1px; top:0; height:40%; }
  #v2 { left:50%; width:1px; top:60%; bottom:0; }
  video { position:fixed; width:1px; height:1px; opacity:0; pointer-events:none; }
  #dot { position:fixed; top:calc(env(safe-area-inset-top) + 8px); right:12px;
    width:8px; height:8px; border-radius:50%; background:#f00; opacity:0; pointer-events:none; }
  #msg { position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 24px);
    text-align:center; color:#2a2a2a; font:14px -apple-system, sans-serif; pointer-events:none; }
  #guide { position:fixed; inset:0; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:2fr 1fr 2fr;
    pointer-events:none; opacity:0; transition:opacity .6s; }
  #guide div { display:flex; align-items:center; justify-content:center; text-align:center;
    padding:8px; color:#444; font:15px -apple-system, sans-serif; }
  #guide .mid { grid-column:1 / 3; }
  #save { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 60px);
    transform:translateX(-50%); display:none; background:#050505; color:#2a2a2a;
    border:1px solid #111; border-radius:20px; padding:12px 24px; font:15px -apple-system, sans-serif; }
</style>
</head>
<body>
<video id="v" muted playsinline autoplay></video>
<div id="pad"></div>
<div class="line" id="h1"></div>
<div class="line" id="h2"></div>
<div class="line" id="v1"></div>
<div class="line" id="v2"></div>
<div id="guide">
  <div>左上：写真</div>
  <div>右上：写真＋ライト</div>
  <div class="mid">中央：インカメラ動画 開始／停止</div>
  <div>左下：動画 開始／停止</div>
  <div>右下：動画＋ライト 開始／停止</div>
</div>
<div id="dot"></div>
<button id="save"></button>
<div id="msg"></div>

<script>
// カメラは撮影・録画の間だけ使い、終わったらすぐ止める（待機中は画面上の表示が出ない）
// マイクは使わない（動画は音声なし）
const SHOW_DOT   = false; // 録画中の赤い点（表示するなら true）
const SHOW_GUIDE = false; // 最初のタップで操作説明を表示（表示するなら true）
const HAPTICS    = true;  // 振動（不要なら false）
const PHOTO_WAIT = 500;   // カメラ起動後、写真を撮るまでの待ち時間（明るさ・ピント合わせ用、ミリ秒）
const TORCH_WAIT = 600;   // 写真でライト点灯後、撮影までの待ち時間（ミリ秒）

const v = document.getElementById('v');
const pad = document.getElementById('pad');
const dot = document.getElementById('dot');
const msg = document.getElementById('msg');
const guide = document.getElementById('guide');
const save = document.getElementById('save');

let stream = null, videoTrack = null, facing = null, torchOn = false;
let rec = null, chunks = [], pending = [], wakeLock = null, busy = false, guided = false;

const sleep = ms => new Promise(r => setTimeout(r, ms));

// 振動（iOS 18以降のSafari）
function haptic(times = 1) {
  if (!HAPTICS) return;
  for (let i = 0; i < times; i++) {
    setTimeout(() => {
      const label = document.createElement('label');
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.setAttribute('switch', '');
      label.style.display = 'none';
      label.appendChild(input);
      document.body.appendChild(label);
      label.click();
      label.remove();
    }, i * 150);
  }
}

// 画面下に薄くメッセージを出して数秒で消す
function notice(text) {
  msg.textContent = text;
  setTimeout(() => { if (msg.textContent === text) msg.textContent = ''; }, 4000);
}

// 指定した向き（environment＝背面、user＝イン）のカメラ映像を取得（マイクなし）
async function openVideoTrack(want) {
  const tries = [
    { facingMode: { exact: want }, width: { ideal: 1920 }, height: { ideal: 1080 } },
    { facingMode: { exact: want } },
    { facingMode: want }
  ];
  let lastErr = null;
  for (const video of tries) {
    try {
      const s = await navigator.mediaDevices.getUserMedia({ video, audio: false });
      const t = s.getVideoTracks()[0];
      const fm = t.getSettings ? t.getSettings().facingMode : undefined;
      if (fm && fm !== want) { t.stop(); continue; } // 違う向きのカメラが開いたらやり直す
      return t;
    } catch (e) {
      lastErr = e;
      if (e.name === 'NotAllowedError') break; // 許可されていないときは他の方法も無駄
    }
  }
  throw lastErr || new Error('カメラが見つかりません');
}

// カメラを開いて、映像が流れ始めるまで待つ
async function openCamera(want) {
  videoTrack = await openVideoTrack(want);
  facing = want;
  stream = new MediaStream([videoTrack]);
  v.srcObject = stream;
  v.play().catch(() => {});
  const start = Date.now();
  while (Date.now() - start < 2000) {
    if (v.videoWidth && v.readyState >= 2) break;
    await sleep(50);
  }
}

// カメラを止める（画面上の表示も消える）
function closeCamera() {
  if (videoTrack) videoTrack.stop();
  videoTrack = null; stream = null; facing = null; torchOn = false;
  v.srcObject = null;
}

// ライト（トーチ）の点灯・消灯（インカメラにはライトがないため何もしない）
async function setTorch(on) {
  if (facing !== 'environment' || !videoTrack) return false;
  const tries = [
    { advanced: [{ torch: on }] }, // iOS Safariで動作報告のある書き方
    { torch: on }
  ];
  for (const c of tries) {
    try {
      await videoTrack.applyConstraints(c);
      torchOn = on;
      return true;
    } catch (e) {}
  }
  return false;
}

function showError(e) {
  notice(e && e.name === 'NotAllowedError' ? 'カメラを許可してください' : 'カメラを開けませんでした');
}

// 画面の自動ロック防止
async function keepAwake() {
  try {
    if ('wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) {}
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    if (rec && rec.state === 'recording') rec.stop();
    else if (!busy) closeCamera();
  }
});

// 無音の写真撮影（背面カメラ。withLight = true でライトを点けて撮影）
async function takePhoto(withLight) {
  if (busy) return;
  busy = true;
  haptic(1);
  try {
    await openCamera('environment');
    await sleep(PHOTO_WAIT); // 明るさ・ピントが合うまで待つ
    if (withLight && await setTorch(true)) await sleep(TORCH_WAIT);
    if (!v.videoWidth) throw new Error('映像がありません');
    blink();
    const c = document.createElement('canvas');
    c.width = v.videoWidth;
    c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0);
    c.toBlob(b => {
      if (b) addPending(new File([b], fileName('jpg'), { type: 'image/jpeg' }));
    }, 'image/jpeg', 0.92);
  } catch (e) {
    showError(e);
  } finally {
    closeCamera(); // 撮影が終わったらすぐカメラを止める
    busy = false;
  }
}

// 録画の開始（want＝使うカメラ、withLight＝ライト点灯）
async function startVideo(want, withLight) {
  if (busy) return;
  busy = true;
  haptic(1);
  try {
    await openCamera(want);
    if (withLight) await setTorch(true);
    const type = MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : '';
    rec = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
    chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      dot.style.opacity = 0;
      closeCamera(); // 録画が終わったらすぐカメラを止める
      const blob = new Blob(chunks, { type: 'video/mp4' });
      chunks = [];
      if (blob.size) addPending(new File([blob], fileName('mp4'), { type: 'video/mp4' }));
    };
    rec.start(1000);
    if (SHOW_DOT) dot.style.opacity = 0.4;
  } catch (e) {
    closeCamera();
    showError(e);
  } finally {
    busy = false;
  }
}

// 録画の停止
function stopVideo() {
  if (rec && rec.state === 'recording') {
    rec.stop();
    haptic(2);
  }
}

function blink() {
  if (!SHOW_DOT) return;
  dot.style.background = '#888';
  dot.style.opacity = 0.4;
  setTimeout(() => { dot.style.opacity = 0; dot.style.background = '#f00'; }, 150);
}

function fileName(ext) {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `BlackCam_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}_${d.getMilliseconds()}.${ext}`;
}

function addPending(file) { pending.push(file); updateSave(); }

function updateSave() {
  save.style.display = pending.length ? 'block' : 'none';
  save.textContent = `保存（${pending.length}件）`;
}

// 保存（共有シート →「ビデオを保存」「画像を保存」）
save.addEventListener('click', async e => {
  e.stopPropagation();
  const files = pending.slice();
  if (navigator.canShare && navigator.canShare({ files })) {
    try { await navigator.share({ files }); } catch (err) { return; } // キャンセル時は残す
  } else {
    files.forEach(f => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(f);
      a.download = f.name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    });
  }
  pending = [];
  updateSave();
});

// 操作：上段 左＝写真／右＝写真＋ライト
//       中央＝インカメラ動画
//       下段 左＝動画／右＝動画＋ライト
// 録画中はどこをタップしても停止
let downX = 0, downY = 0, downT = 0, lastAction = 0;

pad.addEventListener('pointerdown', e => {
  downX = e.clientX; downY = e.clientY; downT = Date.now();
});

pad.addEventListener('pointerup', e => {
  const moved = Math.hypot(e.clientX - downX, e.clientY - downY);
  if (moved > 20 || Date.now() - downT > 800) return; // スワイプ・長押しは無視
  if (Date.now() - lastAction < 500) return;          // 連続反応の防止
  lastAction = Date.now();
  keepAwake();

  if (SHOW_GUIDE && !guided) {
    guided = true;
    guide.style.opacity = 1;
    setTimeout(() => { guide.style.opacity = 0; }, 3000);
  }

  if (rec && rec.state === 'recording') { stopVideo(); return; }

  const y = e.clientY / window.innerHeight;
  const isRight = e.clientX >= window.innerWidth / 2;
  if (y < 0.4) takePhoto(isRight);
  else if (y < 0.6) startVideo('user', false);
  else startVideo('environment', isRight);
});
</script>
</body>
</html>
